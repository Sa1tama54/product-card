<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Каталог товаров</title>
</head>

<body>
  <section class="products">
    <h1 class="products__title">Выбери свой продукт</h1>
    <div class="products__buttons">
      <button id="change-card-color-btn">Сменить цвет первой карточки</button>
      <button id="change-all-cards-color-btn">Сменить цвет всех карточек</button>
      <button id="open-google-btn">Открыть Google</button>
      <button id="output-log-btn">Вывести сообщение в консоль</button>
      <button id="toggle-сolor-btn">Сменить цвет кнопки</button>
    </div>
    <ul class="products__list"></ul>
    <template id="product-card-template">
      <li class="products__item card">
        <img src="" alt="" class="card__picture" />
        <span class="card__category"></span>
        <h2 class="card__title"></h2>
        <p class="card__desc"></p>
        <span class="card__compound-title">Состав:</span>
        <ul class="card__compound">
          <li></li>
          <li></li>
          <li></li>
        </ul>
        <div class="card__price">
          <b class="card__price-label">Цена</b>
          <span class="card__price-value"></span>
        </div>
      </li>
    </template>
  </section>
  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>

</html>
