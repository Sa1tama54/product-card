<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог товаров</title>
  </head>
  <body>
    <section class="products">
      <h1 class="products__title">Выбери свой продукт</h1>
      <ul class="products__list">
        <li class="products__item product-card">
          <img
            src="images/product.jpg"
            alt="Увлажняющий мусс"
            class="product-card__picture"
          />
          <span class="product-card__type">для нормальной кожи</span>
          <h2 class="product-card__title">Увлажняющий мусс</h2>
          <p class="product-card__desc">
            Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.
          </p>
          <span>Состав:</span>
          <ul class="product-card__features">
            <li>активные натуральные комплексы</li>
            <li>витамины С, А, РР, В И Е</li>
            <li>солнцезащитные компоненты</li>
          </ul>
          <div class="product-card__price">
            <b class="product-card__price-label">Цена</b>
            <span class="product-card__price-value">2 750 ₽</span>
          </div>
        </li>
      </ul>
    </section>
  </body>
</html>
