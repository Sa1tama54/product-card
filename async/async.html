<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Async Page</title>
</head>

<body>
  <main>
    <div class="users__buttons">
      <button id="get-cards-btn">получить все карточки</button>
      <button id="remove-all-cards-btn">Удалить все карточки</button>
    </div>

    <ul class="users"></ul>
    <template id="user-card-template">
      <li class="user-card">
        <h3 class="user-card__name"></h3>
        <p class="user-card__age"></p>
        <a href="#" class="user-card__email"></a>
        <button id="remove-card-btn">удалить</button>
      </li>
    </template>


    <p class="message"></p>
  </main>
  <script type="module" src="async.js"></script>
</body>

</html>
